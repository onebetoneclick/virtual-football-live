<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Virtual Football Live</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07120c;color:#fff;font-family:Arial,sans-serif}.top{padding:14px;background:#111b16;text-align:center}.top h1{margin:0 0 5px;font-size:22px}.status{font-size:13px;color:#9cff00}.controls{text-align:center;padding:10px}button{border:0;border-radius:8px;padding:11px 24px;background:#9cff00;color:#081000;font-weight:700;cursor:pointer}button:disabled{opacity:.5}.score{width:min(1100px,96%);margin:auto;background:#111b16;border-radius:12px;padding:12px;display:flex;align-items:center;justify-content:space-around;text-align:center}.team{width:38%;font-weight:700}.team small{display:block;color:#aaa;margin-top:4px}.goals{font-size:38px}.clock{width:20%;font-weight:700}.clock b{font-size:23px}.clock small{display:block;color:#9cff00;margin-top:5px}.main{width:min(1300px,97%);margin:12px auto;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px}.pitch{position:relative;width:100%;aspect-ratio:2/1;border:3px solid #fff;overflow:hidden;background:repeating-linear-gradient(90deg,#168447 0,#168447 10%,#1b8d4c 10%,#1b8d4c 20%)}.line{position:absolute;background:#fff}.mid{left:50%;top:0;width:2px;height:100%}.circle{position:absolute;width:20%;aspect-ratio:1;left:40%;top:25%;border:2px solid #fff;border-radius:50%}.dot{position:absolute;width:6px;height:6px;left:calc(50% - 3px);top:calc(50% - 3px);background:#fff;border-radius:50%}.box{position:absolute;top:25%;width:16%;height:50%;border:2px solid #fff}.leftbox{left:0}.rightbox{right:0}.player{position:absolute;width:30px;height:30px;transform:translate(-50%,-50%);border:2px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:bold;z-index:4;transition:left .9s linear,top .9s linear}.home{background:#1565ff}.away{background:#e53935}.player.holder{box-shadow:0 0 0 4px #ffd900,0 0 18px #ffd900}.name{position:absolute;top:31px;white-space:nowrap;font-size:9px;text-shadow:0 1px 3px #000}.ball{position:absolute;width:15px;height:15px;transform:translate(-50%,-50%);background:#fff;border:2px solid #111;border-radius:50%;z-index:10;transition:left .45s linear,top .45s linear}.side{background:#101a15;border-radius:12px;padding:12px;min-height:100%}.side h3{margin:2px 0 10px}.commentary{height:430px;overflow:auto}.comment{padding:8px 5px;border-bottom:1px solid #27342c;font-size:13px}.goal{color:#ffd900;font-weight:bold}.matches{width:min(1300px,97%);margin:12px auto;background:#101a15;border-radius:12px;padding:12px}.match-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.match{background:#18241d;border-radius:8px;padding:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}.match.live{outline:2px solid #9cff00}.match .status{font-size:10px}.match .score{padding:0;background:none;width:auto;font-size:18px}.fulltime{display:none;width:min(1100px,96%);margin:15px auto;background:#111b16;border-radius:14px;padding:18px}.fulltime.show{display:block}.table-row{display:grid;grid-template-columns:35px 1fr 45px 45px 45px 55px;gap:5px;padding:8px 4px;border-bottom:1px solid #29362f;font-size:13px}.table-head{color:#9cff00;font-weight:bold}.next{margin-top:15px;width:100%}.goalpop{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.8);opacity:0;pointer-events:none;background:#111b16;border:3px solid #ffd900;border-radius:16px;padding:25px;text-align:center;z-index:50;transition:.25s}.goalpop.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.goalpop b{display:block;font-size:42px;color:#ffd900}.goalpop span{font-size:20px}@media(max-width:850px){.main{grid-template-columns:1fr}.side{min-height:auto}.commentary{height:220px}.match-list{grid-template-columns:1fr}.table-row{grid-template-columns:28px 1fr 35px 35px 35px 45px;font-size:11px}}
</style>
</head>
<body>
<div class="top"><h1>⚽ Virtual Football Live</h1><div id="status" class="status">Connecting...</div></div>
<div class="controls"><button id="start">▶ Start Week 1</button></div>
<div class="score"><div class="team"><div id="home">Home</div><small>HOME</small></div><div class="clock"><b id="score">0 - 0</b><small id="clock">00:00 · NOT STARTED</small></div><div class="team"><div id="away">Away</div><small>AWAY</small></div></div>
<div class="main">
  <div class="pitch" id="pitch"><div class="line mid"></div><div class="circle"></div><div class="dot"></div><div class="box leftbox"></div><div class="box rightbox"></div></div>
  <aside class="side"><h3>📝 LIVE COMMENTARY</h3><div id="commentary" class="commentary">Waiting for the match...</div></aside>
</div>
<div class="matches"><h3>📅 WEEK <span id="week">1</span> — LIVE MATCHES</h3><div id="matches" class="match-list"></div></div>
<section id="fulltime" class="fulltime"><h2>🏁 Week <span id="finishedWeek">1</span> Complete</h2><p>All scheduled matches have finished.</p><div class="table-row table-head"><span>#</span><span>Club</span><span>P</span><span>W</span><span>D</span><span>Pts</span></div><div id="table"></div><button id="next" class="next">Next Week →</button></section>
<div id="goalpop" class="goalpop"><b>⚽ GOAL!</b><span id="goaltext"></span></div>
<script>
const WS='wss://virtual-football-live.onrender.com/ws/live';
const socket=new WebSocket(WS);const $=id=>document.getElementById(id);const players={};let playerList=[];let lastGoal='';
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function createPlayer(p){const e=document.createElement('div');e.className='player '+(p.side==='home'?'home':'away');e.innerHTML=`${esc(p.number)}<span class="name">${esc(p.name)}</span>`;e.dataset.id=p.id;$('pitch').appendChild(e);players[p.id]=e}
function renderPlayers(list,holder){if(!Array.isArray(list))return;playerList=list;list.forEach(p=>{if(!players[p.id])createPlayer(p);const e=players[p.id];e.style.left=Math.max(2,Math.min(98,Number(p.x)))+'%';e.style.top=Math.max(4,Math.min(96,Number(p.y)))+'%';e.classList.toggle('holder',p.id===holder)})}
function renderBall(b){if(!b)return;let e=$('liveBall');if(!e){e=document.createElement('div');e.id='liveBall';e.className='ball';$('pitch').appendChild(e)}e.style.left=Number(b.x)+'%';e.style.top=Number(b.y)+'%'}
function renderCommentary(list){if(!Array.isArray(list))return;$('commentary').innerHTML='';list.slice().reverse().forEach(x=>{let t=typeof x==='string'?x:(x.time?`${x.time} — ${x.text}`:(x.text||x.description||JSON.stringify(x)));const d=document.createElement('div');d.className='comment '+(/goal/i.test(t)?'goal':'');d.textContent='⚽ '+t;$('commentary').appendChild(d)})}
function renderLive(d){if(!d)return;$('home').textContent=d.homeTeam||'Home';$('away').textContent=d.awayTeam||'Away';$('score').textContent=`${d.score?.home??0} - ${d.score?.away??0}`;$('clock').textContent=`${d.displayClock||'00:00'} · ${(d.period||'not started').replaceAll('_',' ').toUpperCase()}`;renderPlayers(d.players,d.ball?.holder);renderBall(d.ball);renderCommentary(d.commentary);if(d.goal){const key=JSON.stringify(d.goal);if(key!==lastGoal){lastGoal=key;$('goaltext').textContent=`${d.goal.team} — ${d.goal.scorer} · ${d.goal.score}`;$('goalpop').classList.add('show');setTimeout(()=>$('goalpop').classList.remove('show'),4500)}}}
function renderWeek(w){if(!w)return;$('week').textContent=w.week;const list=$('matches');list.innerHTML='';(w.matches||[]).forEach((m,i)=>{const d=document.createElement('div');d.className='match '+(m.status==='running'?'live':'');d.innerHTML=`<span><b>${esc(m.home)}</b> vs <b>${esc(m.away)}</b><small class="status">${esc(m.status)}</small></span><span class="score">${m.score?.home??0} - ${m.score?.away??0}</span>`;d.onclick=()=>socket.send(JSON.stringify({type:'select_match',index:i}));list.appendChild(d)});if(w.status==='week_complete'){renderTable(w.standings||[]);$('fulltime').classList.add('show');$('finishedWeek').textContent=w.week}else $('fulltime').classList.remove('show')}
function renderTable(rows){$('table').innerHTML='';rows.forEach((r,i)=>{const d=document.createElement('div');d.className='table-row';d.innerHTML=`<span>${i+1}</span><span>${esc(r.club)}</span><span>${r.played}</span><span>${r.won}</span><span>${r.drawn}</span><span>${r.points}</span>`;$('table').appendChild(d)})}
socket.onopen=()=>{$('status').textContent='🟢 WebSocket Connected';$('start').disabled=false};socket.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='live_state')renderLive(m.data);if(m.type==='week_state'||m.type==='week_complete')renderWeek(m.data)};socket.onerror=()=>$('status').textContent='🔴 WebSocket Error';socket.onclose=()=>$('status').textContent='⚠️ WebSocket Disconnected';
$('start').onclick=()=>{socket.send(JSON.stringify({type:'start_week',week:1}));$('start').disabled=true};$('next').onclick=()=>{socket.send(JSON.stringify({type:'next_week'}));$('fulltime').classList.remove('show')};
</script>
</body>
</html>
